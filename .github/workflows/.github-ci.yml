name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    # WICHTIG: Nutzt den lokalen Self-Hosted Runner
    runs-on: self-hosted

    env:
      UV_COMPILE_BYTECODE: "1"
      UV_LINK_MODE: copy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Da uv auf dem lokalen Runner evtl. installiert sein muss oder über ein Python-Tool geladen wird:
      # Falls uv noch nicht global auf deinem Rechner/Runner installiert ist, kannst du es so einrichten:
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run Ruff (Lint)
        continue-on-error: true
        run: uv run ruff check src tests --fix

      - name: Run Ruff (Format Check)
        continue-on-error: true
        run: uv run ruff format --check

      - name: Run Typechecking (ty)
        run: |
          uv run ty check

      - name: Run Pytest & Generate Reports
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          uv run pytest -p pytest_cov.plugin --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=junit.xml

      - name: Upload Test Results & Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
